name: Deploy to AWS App Runner

on:
  push:
    branches:
      - main # Change to your default branch
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

env:
  AWS_REGION: us-east-2
  APP_NAME: strategist-api
  # Terraform variables will automatically pick up TF_VAR_ env vars
  TF_VAR_aws_region: us-east-2
  TF_VAR_app_name: strategist-api

jobs:
  deploy:
    name: Deploy API to AWS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Bootstrap Terraform State Resources
        id: bootstrap-state
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="${{ env.APP_NAME }}-tf-state-$ACCOUNT_ID"
          TABLE_NAME="${{ env.APP_NAME }}-tf-locks"
          
          # Create S3 Bucket if it doesn't exist
          if ! aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
            echo "Creating S3 bucket: $BUCKET_NAME"
            aws s3api create-bucket --bucket "$BUCKET_NAME" --region ${{ env.AWS_REGION }} --create-bucket-configuration LocationConstraint=${{ env.AWS_REGION }}
            aws s3api put-bucket-versioning --bucket "$BUCKET_NAME" --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$BUCKET_NAME" --server-side-encryption-configuration '{"Rules": [{"ApplyServerSideEncryptionByDefault": {"SSEAlgorithm": "AES256"}}]}'
          fi
          
          # Create DynamoDB Table if it doesn't exist
          if ! aws dynamodb describe-table --table-name "$TABLE_NAME" 2>/dev/null; then
            echo "Creating DynamoDB table: $TABLE_NAME"
            aws dynamodb create-table --table-name "$TABLE_NAME" --attribute-definitions AttributeName=LockID,AttributeType=S --key-schema AttributeName=LockID,KeyType=HASH --billing-mode PAY_PER_REQUEST --region ${{ env.AWS_REGION }}
          fi
          
          echo "TF_STATE_BUCKET=$BUCKET_NAME" >> $GITHUB_ENV
          echo "TF_STATE_TABLE=$TABLE_NAME" >> $GITHUB_ENV

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.APP_NAME }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ env.TF_STATE_TABLE }}"

      - name: Wait for AppRunner to be READY
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-2
        run: |
          echo "Waiting 45 seconds to let App Runner catch up with ECR push..."
          sleep 45
          echo "Waiting for any ongoing AppRunner deployments to finish..."
          while true; do
            STATUS=$(aws apprunner list-services --region us-east-2 --query "ServiceSummaryList[?ServiceName=='strategist-api'].Status" --output text || echo "UNKNOWN")
            if [ "$STATUS" = "RUNNING" ] || [ "$STATUS" = "CREATE_FAILED" ] || [ "$STATUS" = "UNKNOWN" ] || [ -z "$STATUS" ]; then
              echo "AppRunner is ready (Status: $STATUS)"
              break
            fi
            echo "AppRunner status is $STATUS. Waiting 20 seconds..."
            sleep 20
          done

      - name: Terraform Apply - ECR Repository Only
        # We must deploy ECR first so we can push the Docker image
        working-directory: ./terraform
        run: terraform apply -target=aws_ecr_repository.app_repo -auto-approve

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.APP_NAME }}
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Wait for AppRunner to be READY
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-2
        run: |
          echo "Waiting 45 seconds to let App Runner catch up with ECR push..."
          sleep 45
          echo "Waiting for any ongoing AppRunner deployments to finish..."
          while true; do
            STATUS=$(aws apprunner list-services --region us-east-2 --query "ServiceSummaryList[?ServiceName=='strategist-api'].Status" --output text || echo "UNKNOWN")
            if [ "$STATUS" = "RUNNING" ] || [ "$STATUS" = "CREATE_FAILED" ] || [ "$STATUS" = "UNKNOWN" ] || [ -z "$STATUS" ]; then
              echo "AppRunner is ready (Status: $STATUS)"
              break
            fi
            echo "AppRunner status is $STATUS. Waiting 20 seconds..."
            sleep 20
          done

      - name: Terraform Apply - Deploy App Runner Service
        # Now we deploy App Runner, providing production secrets as Terraform variables
        working-directory: ./terraform
        env:
          TF_VAR_database_url: ${{ secrets.CENTINELA_DATABASE_URL }}
          TF_VAR_knowledge_service_url: ${{ secrets.CENTINELA_KNOWLEDGE_SERVICE_URL }}
          TF_VAR_deepseek_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          for i in {1..30}; do
            echo "Attempt $i to apply Terraform..."
            if terraform apply -auto-approve; then
              echo "Terraform apply succeeded!"
              exit 0
            fi
            echo "Terraform apply failed (likely OPERATION_IN_PROGRESS). Retrying in 10 seconds..."
            sleep 10
          done
          echo "Terraform apply failed after 30 attempts."
          exit 1
