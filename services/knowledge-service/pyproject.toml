[project]
name = "knowledge-service"
version = "0.1.0"
description = "Enterprise RAG microservice for Centinela"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "sqlalchemy",
    "psycopg2-binary",
    "pgvector",
    "python-dotenv",
    "python-multipart",
    "pymupdf",
    "langchain",
    "langchain-community",
    "langchain-postgres",
    "langchain-huggingface",
    "langchain-text-splitters",
    "sentence-transformers",
    "pydantic-settings>=2.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
