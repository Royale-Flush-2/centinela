name: Deploy lookout-agent

on:
  push:
    branches:
      - main

env:
  AWS_REGION: "us-east-2"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        working-directory: ./terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=lookout-agent/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform Apply (ECR)
        working-directory: ./terraform
        env:
          TF_VAR_database_url: ${{ secrets.DATABASE_URL }}
          TF_VAR_knowledge_service_url: ${{ secrets.KNOWLEDGE_SERVICE_URL }}
          TF_VAR_orchestrator_url: ${{ secrets.ORCHESTRATOR_URL }}
          TF_VAR_vigia_url: ${{ secrets.VIGIA_URL }}
          TF_VAR_analyzer_url: ${{ secrets.ANALYZER_URL }}
          TF_VAR_clustering_url: ${{ secrets.CLUSTERING_URL }}
          TF_VAR_mcp_server_url: ${{ secrets.MCP_SERVER_URL }}
          TF_VAR_strategist_url: ${{ secrets.STRATEGIST_URL }}
          TF_VAR_embedding_model: ${{ secrets.EMBEDDING_MODEL }}
          TF_VAR_deepseek_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
        run: terraform apply -target=aws_ecr_repository.repo -auto-approve

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/centinela-lookout-agent:latest .
          docker push $ECR_REGISTRY/centinela-lookout-agent:latest

      - name: Wait for AppRunner to be READY
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-2
        run: |
          echo "Waiting for any ongoing AppRunner deployments to finish..."
          while true; do
            STATUS=$(aws apprunner list-services --region us-east-2 --query "ServiceSummaryList[?ServiceName=='centinela-lookout-agent'].Status" --output text || echo "UNKNOWN")
            if [ "$STATUS" = "RUNNING" ] || [ "$STATUS" = "CREATE_FAILED" ] || [ "$STATUS" = "UNKNOWN" ] || [ -z "$STATUS" ]; then
              echo "AppRunner is ready (Status: $STATUS)"
              break
            fi
            echo "AppRunner status is $STATUS. Waiting 20 seconds..."
            sleep 20
          done

      - name: Terraform Apply (AppRunner)
        working-directory: ./terraform
        env:
          TF_VAR_database_url: ${{ secrets.DATABASE_URL }}
          TF_VAR_knowledge_service_url: ${{ secrets.KNOWLEDGE_SERVICE_URL }}
          TF_VAR_orchestrator_url: ${{ secrets.ORCHESTRATOR_URL }}
          TF_VAR_vigia_url: ${{ secrets.VIGIA_URL }}
          TF_VAR_analyzer_url: ${{ secrets.ANALYZER_URL }}
          TF_VAR_clustering_url: ${{ secrets.CLUSTERING_URL }}
          TF_VAR_mcp_server_url: ${{ secrets.MCP_SERVER_URL }}
          TF_VAR_strategist_url: ${{ secrets.STRATEGIST_URL }}
          TF_VAR_embedding_model: ${{ secrets.EMBEDDING_MODEL }}
          TF_VAR_deepseek_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
        run: terraform apply -auto-approve
