name: Reusable Service Deploy

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
        description: 'Name of the service (matches ECR repo name)'
      service_path:
        required: true
        type: string
        description: 'Path to the service directory'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy-role
          aws-region: us-east-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        working-directory: ${{ inputs.service_path }}/terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=prod/${{ inputs.service_name }}/terraform.tfstate" \
            -backend-config="region=us-east-2"

      - name: Terraform Apply (Provision ECR)
        working-directory: ${{ inputs.service_path }}/terraform
        run: terraform apply -target=aws_ecr_repository.repo -auto-approve

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ inputs.service_name }}
          IMAGE_TAG: latest
        run: |
          cd ${{ inputs.service_path }}
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: Terraform Apply (AppRunner and other resources)
        working-directory: ${{ inputs.service_path }}/terraform
        env:
          TF_VAR_deepseek_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
          TF_VAR_knowledge_service_url: ${{ secrets.KNOWLEDGE_SERVICE_URL }}
          TF_VAR_orchestrator_url: ${{ secrets.ORCHESTRATOR_URL }}
          TF_VAR_vigia_url: ${{ secrets.VIGIA_URL }}
          TF_VAR_analyzer_url: ${{ secrets.ANALYZER_URL }}
          TF_VAR_clustering_url: ${{ secrets.CLUSTERING_URL }}
          TF_VAR_mcp_server_url: ${{ secrets.MCP_SERVER_URL }}
          TF_VAR_strategist_url: ${{ secrets.STRATEGIST_URL }}
          TF_VAR_embedding_model: ${{ secrets.EMBEDDING_MODEL }}
        run: terraform apply -auto-approve
