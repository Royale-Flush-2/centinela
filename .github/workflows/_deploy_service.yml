name: Reusable Service Deploy

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
        description: 'Name of the service (matches ECR repo name)'
      service_path:
        required: true
        type: string
        description: 'Path to the service directory'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for AWS OIDC
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # You will need to create this OIDC role in AWS
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy-role
          aws-region: us-east-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ inputs.service_name }}
          IMAGE_TAG: latest
        run: |
          cd ${{ inputs.service_path }}
          # Build the Docker image
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          # Push to ECR
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      # Since AppRunner is tied to ECR, pushing the 'latest' tag will trigger a new deployment automatically
      # if AppRunner is configured with ContinuousIntegration = true. If not, we trigger it manually:
      - name: Trigger AppRunner Deployment
        run: |
          SERVICE_ARN=$(aws apprunner list-services --query "ServiceSummaryList[?ServiceName=='${{ inputs.service_name }}'].ServiceArn" --output text)
          if [ "$SERVICE_ARN" != "None" ] && [ -n "$SERVICE_ARN" ]; then
            echo "Starting deployment for $SERVICE_ARN"
            aws apprunner start-deployment --service-arn $SERVICE_ARN
          else
            echo "Service not found. Skipping trigger."
          fi
