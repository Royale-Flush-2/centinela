name: Deploy Lookout Agent

on:
  push:
    branches: [ "main" ]
    paths:
      - 'services/lookout_agent/**'
      - '.github/workflows/deploy-lookout-agent.yml'
      - '.github/workflows/_deploy_service.yml'

jobs:
  deploy:
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/_deploy_service.yml
    with:
      service_name: 'lookout-agent'
      service_path: 'services/lookout_agent'
      ecr_repo_name: 'centinela-lookout-agent'
      ecr_resource_name: 'repo'
    secrets: inherit
